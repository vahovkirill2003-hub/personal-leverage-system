[project]
name = "personal-leverage-system"
version = "0.0.0"
description = "Personal Leverage System pilot"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiogram==3.30.0",
    "alembic==1.19.0",
    "fastapi==0.141.1",
    "psycopg[binary,pool]==3.3.4",
]

[project.scripts]
pls-web = "pls.processes.web:main"
pls-worker = "pls.processes.worker:main"
pls-scheduler = "pls.processes.scheduler:main"

[dependency-groups]
dev = [
    "hypothesis==6.165.2",
    "pytest==9.1.1",
    "ruff==0.16.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
