services:
  app:
    build:
      context: .
    command:
      - python
      - -c
      - "import time; import pls; time.sleep(86400)"
    environment:
      DATABASE_URL: postgresql://pls_dev:pls_dev_only@postgres:5432/pls_dev
      PLS_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import pls"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pls_dev
      POSTGRES_USER: pls_dev
      POSTGRES_PASSWORD: pls_dev_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pls_dev -d pls_dev"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data

volumes:
  postgres-dev-data:
