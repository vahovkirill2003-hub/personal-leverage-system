---
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tb01:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pls_test
          POSTGRES_USER: pls_test
          POSTGRES_PASSWORD: pls_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pls_test -d pls_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Lint
        run: make lint

      - name: Tests
        env:
          PLS_TEST_DATABASE_URL: postgresql://pls_test:pls_test_only@127.0.0.1:5432/pls_test
        run: make test

      - name: Migration dry-run
        run: make migration-dry-run

      - name: Start local development environment
        run: make dev-up

      - name: Verify liveness and readiness probes
        run: |
          docker compose exec -T web python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live').read()"
          docker compose exec -T web python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready').read()"

      - name: Stop local development environment
        if: always()
        run: make dev-down

      - name: Build the single OCI image
        run: docker build --iidfile .image-id -t "pls:${GITHUB_SHA}" .
