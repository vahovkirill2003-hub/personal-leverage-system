---
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tb01:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Lint
        run: make lint

      - name: Tests
        run: make test

      - name: Migration dry-run
        run: make migration-dry-run

      - name: Build the single OCI image
        run: docker build --iidfile .image-id -t "pls:${GITHUB_SHA}" .
